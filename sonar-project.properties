# Parametros del analisis estatico de MedSchedule.
# El host y el token NO se declaran aqui: llegan por variable de entorno desde
# scripts/sonarqube-escanear.sh, para no versionar credenciales.

sonar.projectKey=medschedule
sonar.projectName=MedSchedule
sonar.projectVersion=2.0

# Codigo propio del proyecto. Se excluye deliberadamente todo lo que no escribe
# el equipo: dependencias, artefactos de compilacion y documentacion.
sonar.sources=app,routes,resources/js,database
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,public/build/**,public/vendor/**,docs/**,storage/**,bootstrap/cache/**,database/migrations/**
sonar.test.exclusions=tests/playwright-report/**,tests/carga/resultados/**
sonar.sourceEncoding=UTF-8

# Cobertura de PHPUnit. El informe se genera aparte con:
#   php artisan test --coverage-clover=coverage.xml
# Si el archivo no existe, SonarQube reporta cobertura cero en lugar de fallar.
sonar.php.coverage.reportPaths=coverage.xml
