# Pipeline de liberacion y despliegue continuo de MedSchedule.
#
# Las cuatro etapas que exige la unidad se encadenan con "needs", de modo que
# ninguna corre si la anterior fallo:
#
#   integracion -> entorno y pruebas (con la compuerta de rendimiento) -> despliegue
#
# El workflow no contiene logica propia: invoca los mismos scripts de scripts/
# que se usan en local y en el Codespace. Asi el pipeline no puede divergir de
# lo que cada integrante ejecuta en su maquina.
name: Liberacion continua

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

concurrency:
    group: liberacion-${{ github.ref }}
    cancel-in-progress: true

jobs:
    integracion:
        name: Integracion
        runs-on: ubuntu-latest

        steps:
            - name: Descargar el codigo
              uses: actions/checkout@v4
              with:
                  # Se necesita el historico para comparar contra la rama base.
                  fetch-depth: 0

            - name: Preparar PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, pdo, pdo_mysql, bcmath

            - name: Preparar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Instalar dependencias de PHP
              run: composer install --no-interaction --prefer-dist

            - name: Instalar dependencias de Node
              run: npm ci

            - name: Revisar la sintaxis de los archivos PHP
              run: |
                  find app routes database tests -name '*.php' -print0 \
                      | xargs -0 -n1 php -l > /dev/null

            # El formato se exige solo sobre los archivos que toca el cambio. El
            # repositorio arrastra trece archivos que no cumplen Prettier desde
            # antes de esta unidad; exigirselo a todo el arbol convertiria el
            # pipeline en un bloqueo permanente ajeno a quien abre el PR. Esta
            # comprobacion impide anadir deuda nueva sin obligar a saldar la vieja.
            - name: Revisar el formato de los archivos modificados
              run: bash scripts/verificar-formato.sh "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"

            - name: Compilar los assets
              run: npm run build

    pruebas:
        name: Entorno de liberacion y pruebas
        runs-on: ubuntu-latest
        needs: integracion

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: medschedule
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -uroot -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: medschedule
            DB_USERNAME: root
            DB_PASSWORD: root
            URL_BASE: http://127.0.0.1:8000

        steps:
            - name: Descargar el codigo
              uses: actions/checkout@v4

            - name: Preparar PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, pdo, pdo_mysql, bcmath

            - name: Preparar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Instalar dependencias
              run: |
                  composer install --no-interaction --prefer-dist
                  npm ci

            - name: Preparar el archivo de entorno
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Instalar k6
              run: bash scripts/instalar-k6.sh

            - name: Generar el entorno de liberacion
              run: bash scripts/entorno-liberacion.sh

            - name: Sembrar las cuentas de las pruebas de carga
              run: php artisan db:seed --class=CargaSeeder --force

            # Compuerta de liberacion: k6 termina con codigo 99 si el p95 supera
            # los 5 s acordados, y ese codigo detiene el pipeline aqui mismo.
            - name: Ejecutar las pruebas en el entorno
              env:
                  K6_PASSWORD: password
              run: bash scripts/pruebas-liberacion.sh

            - name: Publicar los resultados de la prueba de carga
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: resultados-carga-${{ github.run_number }}
                  path: tests/carga/resultados/
                  retention-days: 30
                  if-no-files-found: warn

    despliegue:
        name: Despliegue
        runs-on: ubuntu-latest
        needs: pruebas
        # Solo se despliega lo que ya esta integrado en main y supero la compuerta.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        environment: produccion

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: medschedule
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -uroot -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: medschedule
            DB_USERNAME: root
            DB_PASSWORD: root
            URL_BASE: http://127.0.0.1:8000

        steps:
            - name: Descargar el codigo
              uses: actions/checkout@v4

            - name: Preparar PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  extensions: mbstring, pdo, pdo_mysql, bcmath

            - name: Preparar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Preparar el archivo de entorno
              run: |
                  composer install --no-interaction --prefer-dist
                  cp .env.example .env
                  php artisan key:generate

            # Ejecuta el procedimiento de despliegue completo y verifica que el
            # servicio responde. El entorno de destino se materializa despues a
            # partir de .devcontainer/, que es el artefacto que se libera: quien
            # abra un Codespace desde main obtiene exactamente esta version.
            - name: Generar el despliegue y verificar la salud del servicio
              run: |
                  php artisan serve --host=0.0.0.0 --port=8000 &
                  bash scripts/despliegue.sh
