apiVersion: 1
datasources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki:3100
      jsonData:
          derivedFields:
              - name: trace_id
                matcherRegex: '"trace_id":"([0-9a-f]{32})"'
                url: '$${__value.raw}'
                datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo:3200
      jsonData:
          tracesToLogsV2:
              datasourceUid: loki
              spanStartTimeShift: '-5m'
              spanEndTimeShift: '5m'
              customQuery: true
              query: '{job="medschedule"} |= "$${__span.traceId}"'
          serviceMap:
              datasourceUid: prometheus
